<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Note App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Magic Notes</a>
      <div class="collapse navbar-collapse">
        <form class="d-flex ms-auto" role="search" onsubmit="event.preventDefault();">
          <input class="form-control me-2" id="searchTxt" type="search" placeholder="Search" aria-label="Search" />
          
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Add Note -->
  <div class="container my-3">
    <h1>Welcome to Magic</h1>
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Add a note</h5>
        <div class="mb-3">
          <textarea class="form-control" id="addText" rows="3"></textarea>
        </div>
        <button class="btn btn-primary" id="addBtn">Add Note</button>
      </div>
    </div>

    <h2 class="mt-4">Your Notes</h2>
    <hr />
    <div id="notes" class="row container-fluid"></div>
  </div>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
